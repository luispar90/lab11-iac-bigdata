services:
  floci:
    image: floci/floci:latest
    container_name: ucv-floci
    ports:
      - "4566:4566"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    environment:
      FLOCI_SERVICES_GLUE_JOB_RUN_DURATION_SECONDS: 10


  glue5:
    image: public.ecr.aws/glue/aws-glue-libs:5
    depends_on:
      - floci
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./pipelines:/home/hadoop/workspace/pipelines
    working_dir: /home/hadoop/workspace

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: ucv-airflow
    depends_on:
      - floci
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./airflow:/opt/airflow
    command: standalone
